<!doctype html>
<html lang="en">
<head>
<!--HEAD-->
<title>Stotra Reader</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vishnu Sahasranama and Hanuman Chalisa in Devanagari and IAST, with a one-verse-at-a-time recite mode and a mala counter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&family=Tiro+Devanagari+Sanskrit&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;1,400&text=mr%CC%90%CC%A5&display=swap">
<style>
/* Layout: one narrow reading column like a pothi leaf; a slim bilingual tab bar on top, a floating dock at the thumb, and a full-screen recite card. */
:root {
	--paper: #faf4e8;
	--surface: #f3e7d2;
	--ink: #2a1c10;
	--ink-2: #6d5643;
	--accent: #ad4f0b;
	--accent-ink: #fff8ee;
	--wash: #f5dfc0;
	--rule: #e6d5b9;
	--glow: rgba(236, 140, 48, 0.20);
	--shadow: rgba(84, 46, 10, 0.14);
	--scrim: rgba(42, 28, 16, 0.32);
	--bead: #dcc6a0;

	--f-sa: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", "Mangal", serif;
	--f-hi: "Tiro Devanagari Hindi", "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", "Mangal", serif;
	--f-lat: "Gentium Book Plus", "Noto Serif", "Charis SIL", Georgia, serif;
	--f-ui: "Hind", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

	--scale: 1;
	--hdr: 58px;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--paper: #0d111e;
		--surface: #171c2d;
		--ink: #eee3cd;
		--ink-2: #a79d8b;
		--accent: #f0a24a;
		--accent-ink: #1b1206;
		--wash: #2b2433;
		--rule: #262c40;
		--glow: rgba(240, 162, 74, 0.11);
		--shadow: rgba(0, 0, 0, 0.45);
		--scrim: rgba(3, 5, 12, 0.6);
		--bead: #394058;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--paper: #0d111e;
	--surface: #171c2d;
	--ink: #eee3cd;
	--ink-2: #a79d8b;
	--accent: #f0a24a;
	--accent-ink: #1b1206;
	--wash: #2b2433;
	--rule: #262c40;
	--glow: rgba(240, 162, 74, 0.11);
	--shadow: rgba(0, 0, 0, 0.45);
	--scrim: rgba(3, 5, 12, 0.6);
	--bead: #394058;
	color-scheme: dark;
}

* { box-sizing: border-box; }
html {
	padding-top: env(safe-area-inset-top, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
	-webkit-text-size-adjust: 100%;
	text-size-adjust: 100%;
	background: var(--paper);
}
html.locked, html.locked body { overflow: hidden; }
body {
	margin: 0;
	min-height: 100vh;
	background: var(--paper);
	background-image: radial-gradient(130% 520px at 50% -140px, var(--glow), transparent 70%);
	background-repeat: no-repeat;
	color: var(--ink);
	font-family: var(--f-ui);
	font-size: 16px;
	line-height: 1.5;
	-webkit-tap-highlight-color: transparent;
	overflow-x: hidden;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.topbar {
	position: sticky;
	top: env(safe-area-inset-top, 0px);
	z-index: 20;
	background: color-mix(in srgb, var(--paper) 90%, transparent);
	-webkit-backdrop-filter: saturate(1.4) blur(14px);
	backdrop-filter: saturate(1.4) blur(14px);
	border-bottom: 1px solid transparent;
	transition: border-color .2s;
}
.topbar::before {
	content: "";
	position: absolute;
	left: 0; right: 0; bottom: 100%;
	height: env(safe-area-inset-top, 0px);
	background: var(--paper);
}
.topbar.scrolled { border-bottom-color: var(--rule); }
.tabs {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 4px;
	max-width: 40rem;
	margin: 0 auto;
	padding: 6px 16px;
}
.tab {
	appearance: none;
	border: 0;
	background: transparent;
	border-radius: 12px;
	min-height: 46px;
	padding: 4px 8px;
	display: grid;
	place-items: center;
	align-content: center;
	gap: 0;
	cursor: pointer;
	color: var(--ink-2);
	transition: background .2s, color .2s;
}
.tab .t-dev { font-family: var(--f-sa); font-size: 1.02rem; line-height: 1.25; }
.tab .t-en { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1.2; }
.tab[aria-selected="true"] { background: var(--wash); color: var(--ink); }
.tab[aria-selected="true"] .t-en { color: var(--accent); font-weight: 600; }

/* ---------- reading column ---------- */
.wrap {
	max-width: 40rem;
	margin: 0 auto;
	padding-inline: 16px;
	padding-block: 0 9rem;
}
.hero { padding-block: 2.4rem 1rem; }
.hero .meta {
	margin: 0 0 .9rem;
	font-size: .74rem;
	letter-spacing: .12em;
	text-transform: uppercase;
	color: var(--accent);
	font-weight: 600;
}
.hero h1 {
	margin: 0;
	font-family: var(--f-sa);
	font-weight: 400;
	font-size: clamp(2rem, 8.4vw, 3.1rem);
	line-height: 1.3;
	text-wrap: balance;
	overflow-wrap: anywhere;
}
.text[data-id="hc"] .hero h1 { font-family: var(--f-hi); }
.hero .h-lat {
	margin: .35rem 0 0;
	font-family: var(--f-lat);
	font-style: italic;
	font-size: 1.15rem;
	color: var(--ink-2);
}
.toc {
	margin: 1.8rem 0 0;
	padding: 0;
	list-style: none;
	border-top: 1px solid var(--rule);
}
.toc li { border-bottom: 1px solid var(--rule); }
.toc a {
	display: grid;
	grid-template-columns: minmax(0, 1fr) auto;
	align-items: baseline;
	gap: .2rem 1rem;
	padding: .7rem .1rem;
	min-height: 48px;
	text-decoration: none;
	color: var(--ink);
}
.toc .c-name { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .6rem; }
.toc .c-dev { font-family: var(--f-sa); font-size: 1.12rem; }
.text[data-id="hc"] .toc .c-dev { font-family: var(--f-hi); }
.toc .c-gloss { font-size: .86rem; color: var(--ink-2); }
.toc .c-count { font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.toc a:hover .c-dev { color: var(--accent); }

.sec { padding-top: 2.6rem; }
.sec-head {
	display: grid;
	gap: .15rem;
	padding-bottom: .9rem;
	margin-bottom: .6rem;
	border-bottom: 1px solid var(--rule);
	scroll-margin-top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 8px);
}
.sec-head .eyebrow {
	font-size: .72rem;
	letter-spacing: .12em;
	text-transform: uppercase;
	color: var(--accent);
	font-weight: 600;
}
.sec-head h2 {
	margin: 0;
	font-weight: 400;
	font-family: var(--f-sa);
	font-size: 1.7rem;
	line-height: 1.35;
	text-wrap: balance;
	display: flex;
	flex-wrap: wrap;
	align-items: baseline;
	gap: .1rem .7rem;
}
.text[data-id="hc"] .sec-head h2 { font-family: var(--f-hi); }
.sec-head h2 .s-lat { font-family: var(--f-lat); font-style: italic; font-size: 1.05rem; color: var(--ink-2); }
.sec-head h2 .s-lat:only-child { font-style: normal; font-size: 1.5rem; color: var(--ink); }

.unit {
	display: grid;
	grid-template-columns: 2rem minmax(0, 1fr);
	gap: .55rem;
	padding-block: .85rem;
	border-radius: 10px;
	scroll-margin-top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 10px);
	transition: background-color 1.2s ease;
}
.unit.flash { background-color: var(--wash); transition: none; }
.gut {
	font-size: .76rem;
	font-variant-numeric: tabular-nums;
	color: var(--accent);
	text-align: right;
	padding-top: calc(.62rem * var(--scale));
	font-weight: 500;
	opacity: .9;
}
.ubody { min-width: 0; }
.label {
	margin: 0 0 .25rem;
	font-size: calc(.98rem * var(--scale));
	color: var(--accent);
	font-family: var(--f-sa);
	display: flex;
	flex-wrap: wrap;
	gap: 0 .6rem;
}
.label .lat { font-family: var(--f-lat); font-style: italic; font-size: .92em; }
.dev { font-family: var(--f-sa); }
.text[data-id="hc"] .dev, .rc-hindi .dev { font-family: var(--f-hi); }
.lat { font-family: var(--f-lat); }
.ubody .dev .ln {
	display: block;
	font-size: calc(1.32rem * var(--scale));
	line-height: 1.72;
	padding-left: 1.1em;
	text-indent: -1.1em;
}
.ubody .lat .ln {
	display: block;
	font-size: calc(1.08rem * var(--scale));
	line-height: 1.62;
	padding-left: 1.1em;
	text-indent: -1.1em;
	overflow-wrap: anywhere;
}
.num { color: var(--accent); white-space: nowrap; }
.dnd { color: var(--ink-2); }
.var { color: var(--ink-2); font-size: .82em; }
.unit.alt .ubody { color: var(--ink-2); }

/* script modes */
body[data-script="dev"] .lat { display: none; }
body[data-script="lat"] .dev { display: none; }
body[data-script="lat"] .label .lat { display: inline; }
body[data-script="both"] .ubody .lat { margin-top: .3rem; color: var(--ink-2); }
body[data-script="both"] .ubody .lat .ln { font-size: calc(1rem * var(--scale)); }
body[data-script="both"] .label .lat { color: var(--ink-2); }

.colophon {
	margin-top: 3.2rem;
	padding-top: 1.2rem;
	border-top: 1px solid var(--rule);
	font-size: .88rem;
	color: var(--ink-2);
	display: grid;
	gap: .55rem;
}
.colophon p { margin: 0; }
.colophon .end-mark { font-family: var(--f-sa); font-size: 1.3rem; color: var(--accent); text-align: center; margin-bottom: .6rem; }

/* ---------- dock ---------- */
.dock {
	position: fixed;
	left: 50%;
	bottom: calc(14px + env(safe-area-inset-bottom, 0px));
	transform: translateX(-50%);
	z-index: 30;
	display: flex;
	align-items: center;
	gap: 2px;
	padding: 5px;
	border-radius: 999px;
	background: var(--surface);
	border: 1px solid var(--rule);
	box-shadow: 0 10px 30px -8px var(--shadow), 0 2px 6px -2px var(--shadow);
	max-width: calc(100vw - 32px);
}
.dbtn {
	appearance: none;
	border: 0;
	background: transparent;
	min-width: 46px;
	height: 46px;
	border-radius: 999px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: .4rem;
	padding: 0 .7rem;
	cursor: pointer;
	color: var(--ink);
	font-size: .9rem;
	font-weight: 500;
	white-space: nowrap;
}
.dbtn:hover { background: var(--wash); }
.dbtn svg { width: 20px; height: 20px; flex: none; }
.dbtn.script { min-width: 6.4rem; }
.dbtn.script .sc-dev { font-family: var(--f-sa); font-size: 1rem; }
.dbtn.primary { background: var(--accent); color: var(--accent-ink); padding: 0 1.05rem 0 .9rem; font-weight: 600; }
.dbtn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet {
	position: fixed;
	left: 0; right: 0; bottom: 0;
	z-index: 41;
	margin: 0 auto;
	max-width: 30rem;
	max-height: 82vh;
	overflow-y: auto;
	background: var(--surface);
	border: 1px solid var(--rule);
	border-bottom: 0;
	border-radius: 22px 22px 0 0;
	padding: .6rem 20px calc(1.4rem + env(safe-area-inset-bottom, 0px));
	box-shadow: 0 -18px 40px -16px var(--shadow);
}
.sheet .grab { width: 38px; height: 4px; border-radius: 4px; background: var(--rule); margin: 0 auto .8rem; }
.sheet h3 { margin: 0 0 .8rem; font-size: 1.05rem; font-weight: 600; }
.field { display: grid; gap: .45rem; margin-bottom: 1.15rem; }
.field > span { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.seg {
	display: grid;
	grid-auto-flow: column;
	grid-auto-columns: 1fr;
	gap: 3px;
	padding: 3px;
	border-radius: 14px;
	background: var(--paper);
	border: 1px solid var(--rule);
}
.seg button {
	appearance: none;
	border: 0;
	background: transparent;
	min-height: 42px;
	border-radius: 11px;
	cursor: pointer;
	font-size: .95rem;
	color: var(--ink-2);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg .sc-dev { font-family: var(--f-sa); font-size: 1.02rem; }
.sizer { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .6rem; }
.sizer button {
	appearance: none;
	width: 48px; height: 44px;
	border-radius: 12px;
	border: 1px solid var(--rule);
	background: var(--paper);
	cursor: pointer;
	font-family: var(--f-lat);
}
.sizer button:disabled { opacity: .4; cursor: default; }
.sizer .s-small { font-size: .95rem; }
.sizer .s-big { font-size: 1.3rem; }
.sizer output { text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: .95rem; }
.sec-list { list-style: none; margin: 0; padding: 0; }
.sec-list li + li { border-top: 1px solid var(--rule); }
.sec-list button {
	appearance: none;
	border: 0;
	background: transparent;
	width: 100%;
	text-align: left;
	display: grid;
	grid-template-columns: minmax(0, 1fr) auto;
	align-items: baseline;
	gap: 1rem;
	min-height: 52px;
	padding: .6rem .2rem;
	cursor: pointer;
}
.sec-list .c-dev { font-family: var(--f-sa); font-size: 1.1rem; margin-right: .5rem; }
.sec-list .c-gloss { color: var(--ink-2); font-size: .86rem; }
.sec-list .c-count { color: var(--ink-2); font-size: .8rem; font-variant-numeric: tabular-nums; }

/* ---------- recite ---------- */
.recite {
	position: fixed;
	inset: 0;
	z-index: 60;
	background: var(--paper);
	background-image: radial-gradient(120% 60% at 50% 115%, var(--glow), transparent 70%);
	display: grid;
	grid-template-rows: auto auto minmax(0, 1fr) auto;
	padding:
		calc(env(safe-area-inset-top, 0px) + 8px)
		max(16px, env(safe-area-inset-right, 0px))
		calc(env(safe-area-inset-bottom, 0px) + 14px)
		max(16px, env(safe-area-inset-left, 0px));
}
.rc-top { display: grid; grid-template-columns: 46px minmax(0, 1fr) 46px; align-items: center; gap: .5rem; max-width: 46rem; width: 100%; margin: 0 auto; }
.icon-btn {
	appearance: none;
	width: 46px; height: 46px;
	border-radius: 999px;
	border: 1px solid var(--rule);
	background: var(--surface);
	display: inline-grid;
	place-items: center;
	cursor: pointer;
	color: var(--ink);
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.sc { font-family: var(--f-sa); font-size: .95rem; }
.rc-where { text-align: center; min-width: 0; }
.rc-sec { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-pos { font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rc-bar { height: 3px; border-radius: 3px; background: var(--rule); margin: .7rem auto 0; max-width: 46rem; width: 100%; overflow: hidden; }
.rc-bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s ease; }
.rc-stage {
	min-height: 0;
	overflow-y: auto;
	display: grid;
	align-items: center;
	justify-items: center;
	padding: 1.2rem 0;
	touch-action: pan-y;
	outline: none;
}
.rc-card { max-width: 40rem; width: 100%; text-align: center; transition: opacity .18s ease, transform .18s ease; }
.rc-card.out-l { opacity: 0; transform: translateX(-18px); }
.rc-card.out-r { opacity: 0; transform: translateX(18px); }
.rc-card .label { justify-content: center; font-size: calc(1.05rem * var(--scale)); margin-bottom: .7rem; }
.rc-card .dev .ln { display: block; font-size: calc(min(2rem, 6vw) * var(--scale)); line-height: 1.75; text-wrap: balance; }
.rc-card .lat .ln { display: block; font-size: calc(min(1.3rem, 4.6vw) * var(--scale)); line-height: 1.55; text-wrap: balance; overflow-wrap: anywhere; }
.rc-card.long .dev .ln { font-size: calc(min(1.45rem, 5.2vw) * var(--scale)); }
.rc-card.long .lat .ln { font-size: calc(min(1.08rem, 4vw) * var(--scale)); }
.rc-card.vlong .dev .ln { font-size: calc(min(1.15rem, 4.4vw) * var(--scale)); line-height: 1.65; }
.rc-card.vlong .lat .ln { font-size: calc(min(.96rem, 3.7vw) * var(--scale)); }
body[data-script="both"] .rc-card .lat { margin-top: .9rem; color: var(--ink-2); }
.rc-card.alt { color: var(--ink-2); }
.rc-nav {
	display: grid;
	grid-template-columns: 1fr auto 1fr;
	align-items: center;
	gap: .8rem;
	max-width: 30rem;
	width: 100%;
	margin: 0 auto;
}
.rc-nav .step {
	appearance: none;
	justify-self: center;
	width: 58px; height: 58px;
	border-radius: 999px;
	border: 1px solid var(--rule);
	background: var(--surface);
	display: grid;
	place-items: center;
	cursor: pointer;
	color: var(--ink);
}
.rc-nav .step svg { width: 24px; height: 24px; }
.rc-nav .step:disabled { opacity: .35; cursor: default; }
.mala { display: grid; justify-items: center; gap: .3rem; }
.mala-btn {
	appearance: none;
	border: 0;
	background: transparent;
	padding: 0;
	width: 132px; height: 132px;
	border-radius: 999px;
	position: relative;
	cursor: pointer;
	touch-action: manipulation;
	color: var(--ink);
}
.mala-btn svg { width: 100%; height: 100%; display: block; }
.mala-btn .bead { fill: var(--bead); transition: fill .15s; }
.mala-btn .bead.on { fill: var(--accent); }
.mala-btn .meru { fill: var(--accent); }
.mala-btn .core { fill: var(--surface); stroke: var(--rule); }
.mala-btn:active .core { fill: var(--wash); }
.mala-num {
	position: absolute;
	inset: 0;
	display: grid;
	place-content: center;
	text-align: center;
	pointer-events: none;
}
.mala-num b { font-size: 2rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.mala-num small { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-top: .25rem; }
.mala-btn.done .core { fill: var(--wash); }
.mala-meta { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.linkish {
	appearance: none;
	border: 0;
	background: transparent;
	color: var(--accent);
	font-size: .82rem;
	padding: .5rem .4rem;
	min-height: 36px;
	cursor: pointer;
	text-decoration: underline;
	text-underline-offset: 3px;
}
.linkish.confirm { font-weight: 600; }
.kbd-hint { text-align: center; font-size: .74rem; color: var(--ink-2); margin-top: .5rem; }
@media (hover: none) { .kbd-hint { display: none; } }
@media (max-height: 640px) {
	.mala-btn { width: 108px; height: 108px; }
	.mala-num b { font-size: 1.6rem; }
	.rc-nav .step { width: 52px; height: 52px; }
}
@media (min-width: 720px) {
	.unit { grid-template-columns: 2.6rem minmax(0, 1fr); gap: .9rem; }
	.hero { padding-block: 3.6rem 1.2rem; }
}
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { transition: none !important; animation: none !important; }
	html { scroll-behavior: auto !important; }
}
</style>
<!--/HEAD-->
</head>
<body>
<!--BODY-->
<header class="topbar" id="topbar">
	<div class="tabs" role="tablist" aria-label="Choose a text">
		<button class="tab" role="tab" id="tab-vs" data-text="vs" aria-selected="true" aria-controls="text-vs">
			<span class="t-dev" lang="sa">विष्णुसहस्रनाम</span>
			<span class="t-en">Vishnu Sahasranama</span>
		</button>

<main class="wrap" id="main">

				</button>
				<div class="mala-meta"><span id="mala-rounds">0 malas</span><button class="linkish" id="mala-reset">Reset</button></div>
			</div>
			<button class="step" id="rc-next" aria-label="Next verse">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
			</button>
		</div>

	</div>

<script>
"use strict";
const DATA = /*__DATA__*/null;

// <translit>
/* Devanagari to IAST. For Hindi (the Chalisa) it follows ISO 15919 where IAST
   has no letter: ड़ = ṛ, ढ़ = ṛh, so the vowel ऋ becomes r̥. The inherent "a"
   is written wherever the Devanagari has it (no schwa deletion). */
const deva2iast = (function () {
	const CONS = { "क": "k", "ख": "kh", "ग": "g", "घ": "gh", "ङ": "ṅ", "च": "c", "छ": "ch", "ज": "j", "झ": "jh", "ञ": "ñ",
		"ट": "ṭ", "ठ": "ṭh", "ड": "ḍ", "ढ": "ḍh", "ण": "ṇ", "त": "t", "थ": "th", "द": "d", "ध": "dh", "न": "n",
		"प": "p", "फ": "ph", "ब": "b", "भ": "bh", "म": "m", "य": "y", "र": "r", "ल": "l", "ळ": "ḷ", "व": "v",
		"श": "ś", "ष": "ṣ", "स": "s", "ह": "h" };
	const NUKTA = { "क": "q", "ख": "k͟h", "ग": "ġ", "ज": "z", "ड": "ṛ", "ढ": "ṛh", "फ": "f", "य": "ẏ" };
	const VOW = { "अ": "a", "आ": "ā", "इ": "i", "ई": "ī", "उ": "u", "ऊ": "ū", "ऋ": "ṛ", "ॠ": "ṝ", "ऌ": "ḷ", "ॡ": "ḹ",
		"ए": "e", "ऐ": "ai", "ओ": "o", "औ": "au", "ऍ": "ê", "ऑ": "ô" };
	const MAT = { "ा": "ā", "ि": "i", "ी": "ī", "ु": "u", "ू": "ū", "ृ": "ṛ", "ॄ": "ṝ", "ॢ": "ḷ", "ॣ": "ḹ",
		"े": "e", "ै": "ai", "ो": "o", "ौ": "au", "ॅ": "ê", "ॉ": "ô" };
	const SIGN = { "ं": "ṃ", "ः": "ḥ", "ँ": "m̐", "ऽ": "’", "ॐ": "oṃ", "।": "|", "॥": "||",
		"०": "0", "१": "1", "२": "2", "३": "3", "४": "4", "५": "5", "६": "6", "७": "7", "८": "8", "९": "9" };
	const SKIP = /[‌‍᳐-᳿॒॑]/;
	return function (input, hindi) {
		const s = input.normalize("NFC");
		let out = "";
		let pending = false; // a consonant waits for its vowel
		let last = null;     // last consonant letter, for nukta
		for (const ch of s) {
			if (SKIP.test(ch)) continue;
			if (ch === "़") { // nukta
				if (last && NUKTA[last]) out = out.slice(0, out.length - CONS[last].length) + NUKTA[last];
				last = null;
				continue;
			}
			if (CONS[ch]) {
				if (pending) out += "a";
				out += CONS[ch];
				pending = true;
				last = ch;
				continue;
			}
			last = null;
			if (MAT[ch] !== undefined) {
				out += (hindi && ch === "ृ") ? "r̥" : MAT[ch];
				pending = false;
				continue;
			}
			if (ch === "्") { pending = false; continue; } // virama
			if (pending) {
				out += "a";
				pending = false;
				// a + independent i/u inside a word would read as the diphthong; mark the hiatus
				if (ch === "इ") { out += "ï"; continue; }
				if (ch === "उ") { out += "ü"; continue; }
			}
			if (VOW[ch] !== undefined) out += (hindi && ch === "ऋ") ? "r̥" : VOW[ch];
			else if (SIGN[ch] !== undefined) out += SIGN[ch];
			else out += ch;
		}
		if (pending) out += "a";
		return out;
	};
})();
// </translit>

(function () {
	const KEY = "stotra-reader:v1";
	const SCALES = [ 0.85, 0.92, 1, 1.1, 1.2, 1.32, 1.46, 1.6 ];
	const MALA = 108;
	const root = document.documentElement;
	const hostTheme = root.getAttribute("data-theme");
	const $ = (id) => document.getElementById(id);

	let state = { text: "vs", script: "dev", scale: 1, theme: "auto", pos: {}, rec: {}, cnt: {} };
	try {
		const saved = JSON.parse(localStorage.getItem(KEY) || "null");
		if (saved && typeof saved === "object") state = Object.assign(state, saved);
	} catch (e) { /* storage unavailable */ }
	if (!DATA[state.text]) state.text = "vs";
	if (!SCALES.includes(state.scale)) state.scale = 1;

	let saveTimer = 0;
	function save() {
		clearTimeout(saveTimer);
		saveTimer = setTimeout(() => {
			try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
		}, 150);
	}

	const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

	/* Wrap verse-end marks, dandas and bracketed readings for styling. */
	const TOKENS = /(॥\s*[०-९]+\s*॥|\|\|\s*\d+\s*\|\||\([^)]*\)?|॥|।|\|\||\|)/;
	function markup(text, lat) {
		return text.split(TOKENS).map((part, i) => {
			if (i % 2 === 0) return esc(part);
			if (/\d|[०-९]/.test(part) && /॥|\|\|/.test(part)) {
				return "<span class=\"num\">" + (lat ? "|| " + part.replace(/\D/g, "") + " ||" : esc(part)) + "</span>";
			}
			if (part.charAt(0) === "(") return "<span class=\"var\">" + esc(part) + "</span>";
			return "<span class=\"dnd\">" + esc(part) + "</span>";
		}).join("");
	}
	function linesHtml(lines, hindi) {
		const lang = hindi ? "hi" : "sa";
		const dev = lines.map((l) => "<span class=\"ln\">" + markup(l, false) + "</span>").join("");
		const lat = lines.map((l) => "<span class=\"ln\">" + markup(deva2iast(l, hindi), true) + "</span>").join("");
		return "<div class=\"dev\" lang=\"" + lang + "\">" + dev + "</div><div class=\"lat\" lang=\"" + lang + "-Latn\">" + lat + "</div>";
	}
	function labelHtml(label, hindi) {
		return "<p class=\"label\"><span class=\"dev\">" + esc(label) + "</span><span class=\"lat\">" + esc(deva2iast(label, hindi)) + "</span></p>";
	}
	function secLat(sec, hindi) { return sec.lat || cap(deva2iast(sec.dev, hindi)); }
	function secCount(t, sec) {
		const numbered = sec.units.filter((u) => u.n).length;
		if (t.hindi) {
			if (sec.id === "aarti") return sec.units.reduce((a, u) => a + u.lines.length, 0) + " lines";
			if (sec.id === "chaupai") return numbered + " caupāīs";
			return (numbered || sec.units.length) + ((numbered || sec.units.length) === 1 ? " dohā" : " dohās");
		}
		if (numbered) return numbered + " ślokas";
		if (sec.id === "nyasa") return "Nyāsa";
		return sec.units.length + " ślokas";
	}
	function unitName(t, sec, u) {
		if (!u.n) return secLat(sec, t.hindi);
		if (t.hindi) return (sec.id === "chaupai" ? "Caupāī " : "Dohā ") + u.n;
		return secLat(sec, t.hindi) + " · Śloka " + u.n;
	}

	/* ---------- render ---------- */
	const flat = {}; // text id -> [{ sec, u, el }]
	function renderText(t) {
		const host = $("text-" + t.id);
		const lang = t.hindi ? "hi" : "sa";
		const list = [];
		let h = "<header class=\"hero\"><p class=\"meta\">" + esc(t.meta) + "</p>"
			+ "<h1 lang=\"" + lang + "\">" + esc(t.dev) + "</h1>"
			+ "<p class=\"h-lat\">" + esc(t.lat) + "</p><ol class=\"toc\">";
		t.sections.forEach((sec) => {
			h += "<li><a href=\"#" + t.id + "-" + sec.id + "\" data-jump=\"" + sec.id + "\"><span class=\"c-name\">"
				+ (sec.dev ? "<span class=\"c-dev\" lang=\"" + lang + "\">" + esc(sec.dev) + "</span>" : "<span class=\"c-dev c-latname\">" + esc(sec.lat) + "</span>")
				+ "<span class=\"c-gloss\">" + esc(sec.dev ? secLat(sec, t.hindi) + " · " + sec.gloss : sec.gloss) + "</span></span>"
				+ "<span class=\"c-count\">" + esc(secCount(t, sec)) + "</span></a></li>";
		});
		h += "</ol></header>";
		let k = 0;
		t.sections.forEach((sec) => {
			h += "<section class=\"sec\" data-sec=\"" + sec.id + "\"><div class=\"sec-head\" id=\"" + t.id + "-" + sec.id + "\">"
				+ "<span class=\"eyebrow\">" + esc(sec.gloss) + "</span><h2>"
				+ (sec.dev ? "<span lang=\"" + lang + "\">" + esc(sec.dev) + "</span>" : "")
				+ "<span class=\"s-lat\">" + esc(secLat(sec, t.hindi)) + "</span></h2></div>";
			sec.units.forEach((u) => {
				const id = t.id + "-u" + k;
				h += "<article class=\"unit" + (u.alt ? " alt" : "") + "\" id=\"" + id + "\" data-k=\"" + k + "\">"
					+ "<div class=\"gut\" aria-hidden=\"true\">" + (u.n || "") + "</div><div class=\"ubody\">"
					+ (u.label ? labelHtml(u.label, t.hindi) : "")
					+ linesHtml(u.lines, t.hindi) + "</div></article>";
				list.push({ sec, u, id });
				k++;
			});
			h += "</section>";
		});
		h += "<footer class=\"colophon\"><p class=\"end-mark\" aria-hidden=\"true\">॥</p>"
			+ "<p>Text from <a href=\"" + t.source + "\" target=\"_blank\" rel=\"noopener\">sanskritdocuments.org</a> "
			+ "(<a href=\"" + t.pdf + "\" target=\"_blank\" rel=\"noopener\">Devanagari PDF</a>), reproduced as published. "
			+ "Their texts are prepared by volunteers for personal study and research; please help maintain respect for the volunteer spirit.</p>"
			+ (t.hindi
				? "<p>Verse numbers are added here for reference; the source does not number the Chalisa. The romanization follows ISO 15919 for Hindi letters (ड़ ṛ, ऋ r̥) and keeps every written vowel.</p>"
				: "<p>Verse numbers are the source’s own. As the source notes, verse numbering differs between prints used for chanting. Bracketed words are alternate readings given in the source.</p>")
			+ "<p>The IAST transliteration is generated in this page from the Devanagari.</p></footer>";
		host.innerHTML = h;
		list.forEach((x) => { x.el = document.getElementById(x.id); });
		flat[t.id] = list;
	}
	renderText(DATA.vs);
	renderText(DATA.hc);

	/* ---------- preferences ---------- */
	const SCRIPT_LABEL = {
		dev: "<span class=\"sc-dev\" lang=\"sa\">देवनागरी</span>",
		lat: "IAST",
		both: "Both",
	};
	const SCRIPT_SHORT = { dev: "अ", lat: "A", both: "अA" };
	const NEXT_SCRIPT = { dev: "lat", lat: "both", both: "dev" };
	function applyScript() {
		document.body.dataset.script = state.script;
		$("btn-script").innerHTML = SCRIPT_LABEL[state.script];
		$("rc-script").textContent = SCRIPT_SHORT[state.script];
		document.querySelectorAll("#seg-script button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.script)));
	}
	function applyScale() {
		root.style.setProperty("--scale", state.scale);
		$("size-val").textContent = Math.round(state.scale * 100) + "%";
		const i = SCALES.indexOf(state.scale);
		$("size-down").disabled = i <= 0;
		$("size-up").disabled = i >= SCALES.length - 1;
	}
	function applyTheme() {
		if (state.theme === "light" || state.theme === "dark") root.setAttribute("data-theme", state.theme);
		else if (hostTheme) root.setAttribute("data-theme", hostTheme);
		else root.removeAttribute("data-theme");
		document.querySelectorAll("#seg-theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.theme)));
	}
	function withAnchor(fn) { // keep the verse at the top of the screen in place when layout changes
		const k = currentIndex();
		fn();
		requestAnimationFrame(() => scrollToUnit(state.text, k, false));
	}
	applyScript();
	applyScale();
	applyTheme();

	$("btn-script").addEventListener("click", () => withAnchor(() => { state.script = NEXT_SCRIPT[state.script]; applyScript(); save(); }));
	$("rc-script").addEventListener("click", () => { state.script = NEXT_SCRIPT[state.script]; applyScript(); renderRecite(0); save(); });
	$("seg-script").addEventListener("click", (e) => {
		const b = e.target.closest("button"); if (!b) return;
		withAnchor(() => { state.script = b.dataset.v; applyScript(); save(); });
	});
	$("seg-theme").addEventListener("click", (e) => {
		const b = e.target.closest("button"); if (!b) return;
		state.theme = b.dataset.v; applyTheme(); save();
	});
	function stepScale(d) {
		const i = Math.min(SCALES.length - 1, Math.max(0, SCALES.indexOf(state.scale) + d));
		withAnchor(() => { state.scale = SCALES[i]; applyScale(); save(); });
	}
	$("size-down").addEventListener("click", () => stepScale(-1));
	$("size-up").addEventListener("click", () => stepScale(1));

	/* ---------- text switching and reading position ---------- */
	const topbar = $("topbar");
	function hdr() { return topbar.getBoundingClientRect().bottom; }
	function currentIndex() {
		const list = flat[state.text];
		const top = hdr() + 16;
		for (let i = 0; i < list.length; i++) {
			const r = list[i].el.getBoundingClientRect();
			if (r.bottom > top) return i;
		}
		return list.length - 1;
	}
	function scrollToUnit(textId, k, flash) {
		const list = flat[textId];
		if (!list || !list.length) return;
		if (k === null || k === undefined || k <= 0) {
			if (k === 0 && flash) list[0].el.scrollIntoView({ block: "start" });
			else window.scrollTo(0, 0);
			return;
		}
		const x = list[Math.min(k, list.length - 1)];
		x.el.scrollIntoView({ block: "start" });
		if (flash) {
			x.el.classList.add("flash");
			setTimeout(() => x.el.classList.remove("flash"), 60);
		}
	}
	function showText(id, restore) {
		state.text = id;
		document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.text === id)));
		document.querySelectorAll(".text").forEach((s) => { s.hidden = s.dataset.id !== id; });
		renderSectionList();
		if (restore) scrollToUnit(id, state.pos[id], false);
		save();
	}
	document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
		if (b.dataset.text === state.text) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
		state.pos[state.text] = currentIndex();
		showText(b.dataset.text, true);
	}));

	let ticking = false;
	let posTimer = 0;
	window.addEventListener("scroll", () => {
		if (ticking) return;
		ticking = true;
		requestAnimationFrame(() => {
			ticking = false;
			topbar.classList.toggle("scrolled", window.scrollY > 8);
			if (!$("recite").hidden) return;
			clearTimeout(posTimer);
			posTimer = setTimeout(() => {
				state.pos[state.text] = window.scrollY < 40 ? 0 : currentIndex();
				save();
			}, 250);
		});
	}, { passive: true });

	document.addEventListener("click", (e) => {
		const a = e.target.closest("[data-jump]");
		if (!a) return;
		e.preventDefault();
		const head = document.getElementById(state.text + "-" + a.dataset.jump);
		if (head) head.scrollIntoView({ block: "start" });
	});

	/* ---------- sheets ---------- */
	let openSheet = null;
	let sheetReturn = null;
	function showSheet(id) {
		closeSheet();
		openSheet = $(id);
		sheetReturn = document.activeElement;
		$("scrim").hidden = false;
		openSheet.hidden = false;
		const first = openSheet.querySelector("button");
		if (first) first.focus({ preventScroll: true });
	}
	function closeSheet() {
		if (!openSheet) return;
		openSheet.hidden = true;
		$("scrim").hidden = true;
		openSheet = null;
		if (sheetReturn && sheetReturn.focus) sheetReturn.focus({ preventScroll: true });
	}
	$("scrim").addEventListener("click", closeSheet);
	$("btn-display").addEventListener("click", () => showSheet("sheet-display"));
	$("btn-sections").addEventListener("click", () => showSheet("sheet-sections"));
	function renderSectionList() {
		const t = DATA[state.text];
		const lang = t.hindi ? "hi" : "sa";
		$("sec-list").innerHTML = t.sections.map((sec) => "<li><button data-sec=\"" + sec.id + "\"><span>"
			+ (sec.dev ? "<span class=\"c-dev\" lang=\"" + lang + "\">" + esc(sec.dev) + "</span>" : "")
			+ "<span class=\"c-gloss\">" + esc(sec.dev ? secLat(sec, t.hindi) : sec.lat) + "</span></span>"
			+ "<span class=\"c-count\">" + esc(secCount(t, sec)) + "</span></button></li>").join("");
	}
	$("sec-list").addEventListener("click", (e) => {
		const b = e.target.closest("button"); if (!b) return;
		closeSheet();
		const head = document.getElementById(state.text + "-" + b.dataset.sec);
		if (head) head.scrollIntoView({ block: "start" });
	});

	/* ---------- recite ---------- */
	const rc = $("recite");
	let idx = 0;
	let wake = null;
	function buildBeads() {
		const ns = "http://www.w3.org/2000/svg";
		const svg = $("mala-svg");
		const core = document.createElementNS(ns, "circle");
		core.setAttribute("cx", "66"); core.setAttribute("cy", "66"); core.setAttribute("r", "47");
		core.setAttribute("class", "core");
		svg.appendChild(core);
		for (let i = 0; i < MALA; i++) {
			const a = (-90 + (i + 1.5) * (360 / (MALA + 3))) * Math.PI / 180; // three slots left free for the meru bead
			const c = document.createElementNS(ns, "circle");
			c.setAttribute("cx", (66 + 60 * Math.cos(a)).toFixed(2));
			c.setAttribute("cy", (66 + 60 * Math.sin(a)).toFixed(2));
			c.setAttribute("r", "1.75");
			c.setAttribute("class", "bead");
			svg.appendChild(c);
		}
		const meru = document.createElementNS(ns, "circle");
		meru.setAttribute("cx", "66"); meru.setAttribute("cy", "6"); meru.setAttribute("r", "3.4");
		meru.setAttribute("class", "meru");
		svg.appendChild(meru);
	}
	buildBeads();
	const beads = Array.from(document.querySelectorAll("#mala-svg .bead"));
	function counter() {
		const c = state.cnt[state.text];
		if (c && typeof c.n === "number") return c;
		return (state.cnt[state.text] = { n: 0, malas: 0 });
	}
	function renderCounter() {
		const c = counter();
		$("mala-n").textContent = c.n;
		$("mala-rounds").textContent = c.malas + (c.malas === 1 ? " mala" : " malas");
		beads.forEach((b, i) => b.classList.toggle("on", i < c.n));
		$("mala").setAttribute("aria-label", "Count one repetition. " + c.n + " of 108, " + c.malas + " malas complete");
	}
	function renderRecite(dir) {
		const t = DATA[state.text];
		const list = flat[state.text];
		idx = Math.max(0, Math.min(idx, list.length - 1));
		const x = list[idx];
		const card = $("rc-card");
		const draw = () => {
			const n = x.u.lines.length;
			card.className = "rc-card" + (x.u.alt ? " alt" : "") + (n > 8 ? " vlong" : n > 4 ? " long" : "") + (t.hindi ? " rc-hindi" : "");
			card.innerHTML = (x.u.label ? labelHtml(x.u.label, t.hindi) : "") + linesHtml(x.u.lines, t.hindi);
			$("rc-stage").scrollTop = 0;
		};
		$("rc-sec").textContent = unitName(t, x.sec, x.u);
		$("rc-pos").textContent = (idx + 1) + " of " + list.length;
		$("rc-bar").style.width = ((idx + 1) / list.length * 100).toFixed(2) + "%";
		$("rc-prev").disabled = idx === 0;
		$("rc-next").disabled = idx === list.length - 1;
		const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
		if (!dir || reduce) { draw(); return; }
		card.classList.add(dir > 0 ? "out-l" : "out-r");
		setTimeout(() => {
			draw();
			card.classList.add(dir > 0 ? "out-r" : "out-l");
			requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove("out-l", "out-r")));
		}, 140);
	}
	function go(d) {
		const list = flat[state.text];
		const n = idx + d;
		if (n < 0 || n >= list.length) return;
		idx = n;
		state.rec[state.text] = idx;
		save();
		renderRecite(d);
	}
	function openRecite() {
		closeSheet();
		const r = state.rec[state.text];
		idx = typeof r === "number" ? r : currentIndex();
		if (window.scrollY < 40 && typeof r !== "number") idx = 0;
		rc.hidden = false;
		root.classList.add("locked");
		renderRecite(0);
		renderCounter();
		$("rc-stage").focus({ preventScroll: true });
		try {
			if (navigator.wakeLock) navigator.wakeLock.request("screen").then((w) => { wake = w; }).catch(() => {});
		} catch (e) { /* not allowed */ }
	}
	function closeRecite() {
		rc.hidden = true;
		root.classList.remove("locked");
		state.rec[state.text] = idx;
		state.pos[state.text] = idx;
		save();
		scrollToUnit(state.text, idx, true);
		try { if (wake) wake.release(); } catch (e) { /* ignore */ }
		wake = null;
		$("btn-recite").focus({ preventScroll: true });
	}
	$("btn-recite").addEventListener("click", openRecite);
	$("rc-close").addEventListener("click", closeRecite);
	$("rc-prev").addEventListener("click", () => go(-1));
	$("rc-next").addEventListener("click", () => go(1));

	function count() {
		const c = counter();
		c.n += 1;
		if (c.n >= MALA) {
			c.n = 0;
			c.malas += 1;
			$("mala").classList.add("done");
			setTimeout(() => $("mala").classList.remove("done"), 700);
		}
		try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* ignore */ }
		renderCounter();
		save();
	}
	$("mala").addEventListener("click", count);
	let resetArmed = 0;
	$("mala-reset").addEventListener("click", () => {
		const b = $("mala-reset");
		if (!resetArmed) {
			b.textContent = "Tap again to reset";
			b.classList.add("confirm");
			resetArmed = setTimeout(() => { resetArmed = 0; b.textContent = "Reset"; b.classList.remove("confirm"); }, 3000);
			return;
		}
		clearTimeout(resetArmed);
		resetArmed = 0;
		b.textContent = "Reset";
		b.classList.remove("confirm");
		state.cnt[state.text] = { n: 0, malas: 0 };
		renderCounter();
		save();
	});

	let tx = null;
	const stage = $("rc-stage");
	stage.addEventListener("touchstart", (e) => {
		if (e.touches.length !== 1) { tx = null; return; }
		tx = { x: e.touches[0].clientX, y: e.touches[0].clientY };
	}, { passive: true });
	stage.addEventListener("touchend", (e) => {
		if (!tx) return;
		const t = e.changedTouches[0];
		const dx = t.clientX - tx.x;
		const dy = t.clientY - tx.y;
		tx = null;
		if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
	}, { passive: true });

	document.addEventListener("keydown", (e) => {
		if (e.metaKey || e.ctrlKey || e.altKey) return;
		if (e.key === "Escape") {
			if (openSheet) { closeSheet(); return; }
			if (!rc.hidden) { closeRecite(); }
			return;
		}
		if (rc.hidden) return;
		const onButton = e.target && e.target.tagName === "BUTTON";
		if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); go(1); }
		else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); go(-1); }
		else if ((e.key === " " || e.key === "Enter") && !onButton) { e.preventDefault(); count(); }
	});

	/* ---------- start ---------- */
	showText(state.text, false);
	const restore = () => scrollToUnit(state.text, state.pos[state.text], false);
	if (state.pos[state.text]) {
		restore();
		if (document.fonts && document.fonts.ready) document.fonts.ready.then(restore).catch(() => {});
	}
	window.StotraReader = { flat, state, deva2iast }; // for tests
})();
</script>
